[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nvh-pipeline"
version = "0.1.0"
description = "Ballscrew recirculation NVH analysis pipeline with a guided Streamlit front end."
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "pyarrow",
]

[tool.setuptools]
# The package is nvh_pipeline/; the EP_*.py stage scripts sit alongside it at the
# repo root and are imported by name at runtime.
packages = ["nvh_pipeline"]
py-modules = [
    "EP_segment", "EP_loudness", "EP_loudness_plot", "EP_loudness_by_sample",
    "EP_torque", "EP_efficiency", "EP_order_analysis", "EP_Envelope",
    "EP_bandpass", "EP_Sample_summary", "EP_actuation_plot",
    "EP_characteristics",
]
